<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Safari do Mateus - Confirmação de Presença</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Quicksand:wght@600;700&display=swap');
        body { font-family: 'Quicksand', sans-serif; }
        .font-title { font-family: 'Fredoka', cursive; }
        
        /* Paleta de Cores Mickey Safari */
        .bg-safari-sunset {
            background: linear-gradient(180deg, #F7D070 0%, #C87A3E 100%);
        }
        .bg-safari-card {
            background-color: #EAD7C3;
        }

</head>
<body class="bg-[#2B2D1F] text-[#432818] min-h-screen pb-12 antialiased">

    <nav class="bg-[#4A4E39] p-3 flex justify-between items-center px-6 text-white shadow-lg border-b-4 border-[#A3704C]">
        <div class="flex items-center gap-2">
            <span class="text-xl">🌿</span>
            <span class="font-title font-bold tracking-wider text-[#F7D070]">SAFARI DO MATEUS</span>
        </div>
        <div class="flex gap-4 text-xs sm:text-sm">
            <button onclick="switchTab('guest-view')" class="bg-[#6B705C] hover:bg-[#A3B18A] text-white font-bold py-1.5 px-3 rounded-xl transition-all shadow-sm">✨ Convidado</button>
            <button onclick="switchTab('admin-view')" class="bg-[#A3704C] hover:bg-[#BC8A5F] text-white font-bold py-1.5 px-3 rounded-xl transition-all shadow-sm">🔒 Admin</button>
        </div>
    </nav>

    <div class="max-w-5xl mx-auto px-4 mt-8">
        
        <main id="guest-view" class="bg-[#555A3F] rounded-[2.5rem] shadow-2xl overflow-hidden border
